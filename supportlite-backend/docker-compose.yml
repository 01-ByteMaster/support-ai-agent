services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: supportlite
      POSTGRES_USER: supportlite
      POSTGRES_PASSWORD: supportlite_dev
    ports: ["5433:5432"]
    volumes: [supportlite_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportlite -d supportlite"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  supportlite_pgdata:
